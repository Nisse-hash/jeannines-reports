<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Jeannine's — Sign in</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #0A0A0F;
      color: #FFFFFF;
      font-family: Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .card {
      background: #13131A;
      border: 1px solid #1e1e2a;
      border-radius: 12px;
      padding: 48px 40px;
      width: 100%;
      max-width: 380px;
      text-align: center;
    }

    .logo {
      font-family: 'Space Grotesk', Inter, sans-serif;
      font-size: 26px;
      font-weight: 700;
      letter-spacing: -0.5px;
      color: #FFFFFF;
      margin-bottom: 6px;
    }

    .subtitle {
      font-size: 13px;
      color: #999999;
      margin-bottom: 36px;
      letter-spacing: 0.5px;
      text-transform: uppercase;
    }

    input[type="password"] {
      width: 100%;
      background: #0A0A0F;
      border: 1px solid #2a2a3a;
      border-radius: 8px;
      color: #FFFFFF;
      font-size: 16px;
      padding: 14px 16px;
      outline: none;
      margin-bottom: 12px;
      transition: border-color 0.15s;
    }

    input[type="password"]:focus {
      border-color: #C9A84C;
    }

    input[type="password"]::placeholder {
      color: #555;
    }

    button {
      width: 100%;
      background: #C9A84C;
      color: #0A0A0F;
      border: none;
      border-radius: 8px;
      font-size: 15px;
      font-weight: 700;
      padding: 14px;
      cursor: pointer;
      transition: background 0.15s;
      letter-spacing: 0.3px;
    }

    button:hover {
      background: #F0B429;
    }

    .error {
      display: none;
      color: #FF6B6B;
      font-size: 13px;
      margin-top: 14px;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo">Jeannine's</div>
    <div class="subtitle">Daily Reports</div>
    <form method="POST" action="/api/auth" id="loginForm">
      <input type="hidden" name="next" id="nextInput" value="/dashboard.html">
      <input type="password" name="password" id="passwordInput" placeholder="Password" autocomplete="current-password" autofocus>
      <button type="submit">Sign in</button>
    </form>
    <div class="error" id="errorMsg">Incorrect password. Try again.</div>
  </div>

  <script>
    const p = new URLSearchParams(location.search);
    const next = p.get('next');
    if (next) document.getElementById('nextInput').value = next;
    if (p.has('error')) document.getElementById('errorMsg').style.display = 'block';
  </script>
</body>
</html>
